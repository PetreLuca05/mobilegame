<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rezi Library Menu Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D library; Jelly Pop HUD floats on it. Menu column left, lobby list top-right, tools bottom-right */
  --sea:#3fb6d8;
  --ink:#173A3A;
  --ink-soft:#2A5753;
  --teal-text:#0B6B62;
  --surface:#FFFFFF;
  --surface-tint:#EAF7F3;
  --lip-mint:#B5E6D8;
  --primary:#FFC933;
  --primary-lip:#D99A00;
  --accent:#0E8F83;
  --accent-lip:#0A6A61;
  --bad:#C93A3A;
  --bad-lip:#8E2424;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--teal-text);outline-offset:3px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 18px;border-radius:20px;background:var(--surface);box-shadow:0 6px 0 var(--lip-mint),inset 0 4px 0 rgba(255,255,255,.55);font-family:var(--display);font-weight:800;font-size:20px;line-height:1;color:var(--ink);transform-origin:50% 100%;transition:transform .09s ease-out}
.btn:active{transform:scale(1.07,.86)}
.btn.primary{background:var(--primary);box-shadow:0 6px 0 var(--primary-lip),inset 0 4px 0 rgba(255,255,255,.55)}
.btn.accent{background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--accent-lip),inset 0 4px 0 rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:4px 14px;font-size:16px;border-radius:16px;box-shadow:0 4px 0 var(--accent-lip),inset 0 3px 0 rgba(255,255,255,.3)}
.btn small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--teal-text)}
.card{background:var(--surface);border-radius:24px;box-shadow:0 7px 0 var(--lip-mint)}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-text);font-weight:800}

.hud{position:absolute;opacity:0;pointer-events:none;transition:opacity .28s,transform .45s cubic-bezier(.3,1.6,.5,1)}
#menu{left:max(16px,3vw);top:max(14px,3vh);bottom:max(18px,4vh);width:min(230px,44vw);display:flex;flex-direction:column;gap:12px;transform:translateX(-40px)}
#menu h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,64px);line-height:.9;margin:0;color:#fff;text-shadow:0 5px 0 var(--ink)}
#menu p{margin:-4px 0 4px;color:#fff;font-size:14px;text-shadow:0 2px 0 var(--ink)}
#menu .grow{flex:1}
#bCont{min-height:56px;font-size:24px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{scale:1.03}}

#lobby{right:max(16px,3vw);top:max(14px,3vh);width:min(230px,44vw);display:flex;flex-direction:column;gap:9px;transform:translateX(40px)}
.chip{display:flex;align-items:center;gap:9px;padding:6px 14px 6px 6px;border-radius:99px;background:var(--surface);box-shadow:0 5px 0 var(--lip-mint);align-self:flex-end}
.chip b{font-family:var(--display);font-size:18px;line-height:1}
.chip span{font-size:12px;color:var(--teal-text)}
.head{flex:none;width:34px;height:34px;border-radius:50%;background:#f2c9a5;border:3px solid var(--ink);box-shadow:inset 0 -9px 0 rgba(0,0,0,.12),inset 0 11px 0 var(--hair,#5a3a22)}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;text-shadow:0 2px 0 var(--ink);font-size:15px;font-weight:800}
#lobL{display:flex;flex-direction:column;gap:9px}
.lrow{display:flex;align-items:center;gap:9px;min-height:46px;padding:5px 6px;border-radius:16px;background:var(--surface-tint);box-shadow:0 4px 0 var(--lip-mint);animation:rowin .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rowin{from{transform:translateX(60px);opacity:0}}
.lrow span{flex:1;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow svg{flex:none}
.kick{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bad);color:#fff;box-shadow:0 3px 0 var(--bad-lip);font-size:20px;line-height:1;font-weight:800;transform-origin:50% 100%;transition:transform .09s}
.kick:active{transform:scale(1.07,.86)}

#mapTop{left:max(16px,3vw);top:max(14px,3vh);display:flex;gap:10px;align-items:center;transform:translateY(-30px)}
#mapTop .pill{padding:8px 16px;border-radius:99px;background:var(--surface);box-shadow:0 5px 0 var(--lip-mint);font-family:var(--display);font-size:18px;line-height:1.2}
#mapCard{right:max(16px,3vw);top:50%;width:min(250px,46vw);padding:16px;display:flex;flex-direction:column;gap:10px;transform:translate(40px,-50%)}
#mapCard h3{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;margin:0}
#mapCard p{margin:0;font-size:13px;color:var(--ink-soft)}

#tools{right:12px;bottom:12px;left:12px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;opacity:1}
#tools button{pointer-events:auto;padding:7px 11px;border-radius:12px;background:rgba(23,58,58,.82);color:#fff;font-size:13px}
#tools button:hover{background:var(--ink)}
.tag{position:absolute;left:0;top:0;padding:2px 9px;border-radius:99px;background:var(--surface);box-shadow:0 3px 0 var(--lip-mint);font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;will-change:transform;opacity:0;transition:opacity .25s}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-80px);padding:9px 18px;border-radius:99px;background:var(--surface);box-shadow:0 5px 0 var(--lip-mint);font-size:14px;transition:transform .5s cubic-bezier(.3,1.6,.5,1);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
#toast.on{transform:translate(-50%,0)}
#dump{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(23,58,58,.35);padding:16px;z-index:5}
#dump .card{width:min(640px,100%);padding:16px;display:flex;flex-direction:column;gap:10px}
#dump textarea{width:100%;height:44vh;background:var(--surface-tint);color:var(--ink);border:0;border-radius:12px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;-webkit-user-select:text;user-select:text}
#err{position:absolute;inset:auto 16px 60px 16px;padding:12px 14px;border-radius:12px;background:#8E2424;color:#fff;display:none;z-index:9;font-size:13px}

#app[data-s="menu"] #menu,#app[data-s="menu"] #lobby,#app[data-s="map"] #mapTop{opacity:1;pointer-events:auto;transform:none}
#app[data-s="map"] #mapCard{opacity:1;pointer-events:auto;transform:translate(0,-50%)}
#app[data-s="menu"] .tag.on{opacity:1}
@media (max-width:560px){
  .btn{min-height:40px;font-size:17px}
  #bCont{min-height:46px;font-size:20px}
  #menu{gap:9px}
  #mapCard{top:auto;bottom:60px;transform:translate(40px,0)}
  #app[data-s="map"] #mapCard{transform:none}
}
@media (prefers-reduced-motion:reduce){.hud,.btn,#toast{transition:opacity .15s}#bCont,.lrow{animation:none}}
</style>
</head>
<body>
<div id="app" data-s="menu">
  <canvas id="c" tabindex="-1" aria-label="3D library scene"></canvas>
  <div id="tags"></div>

  <div id="menu" class="hud">
    <h1>Rezi</h1>
    <p>Bibliotecă · sala de lectură</p>
    <button class="btn" id="bNew">New Game</button>
    <button class="btn" id="bMaps">Maps <small>Kumar</small></button>
    <button class="btn" id="bLocker">Locker</button>
    <button class="btn" id="bSet">Settings</button>
    <div class="grow"></div>
    <button class="btn primary" id="bCont">Continue</button>
  </div>

  <div id="lobby" class="hud">
    <div class="chip"><i class="head"></i><div><b>Luca</b><br><span>Online</span></div></div>
    <div class="lhead"><span>Lobby · <b id="lobN">1</b>/4</span><button class="btn accent sm" id="bInv">Invită</button></div>
    <div id="lobL"></div>
  </div>

  <div id="mapTop" class="hud">
    <button class="btn" id="bBack"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 3 5 9l6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Menu</button>
    <div class="pill">Kumar</div>
  </div>
  <div id="mapCard" class="hud card">
    <div class="label">Kumar · Hospital 1 of 9</div>
    <h3>Gastro</h3>
    <p>Stand-in island. In the game this is the real map scene, opened on the last played hospital.</p>
    <button class="btn primary" id="bJoin">Join</button>
  </div>

  <div id="tools" class="hud">
    <button id="tTurn">Turn page now</button>
    <button id="tSip">Do something</button>
    <button id="tRecv">Receive invite</button>
    <button id="tJoin">Join a lobby</button>
    <button id="tMesh">Copy library.mgmesh</button>
    <button id="tScene">Copy library.scene.json</button>
    <button id="tAv">Copy avatar.mgmesh</button>
    <button id="tAvJ">Copy avatar.json</button>
  </div>
  <div id="toast" role="status"></div>
  <div id="dump"><div class="card"><div class="label" id="dumpT">Copy this text</div><textarea id="dumpA" readonly></textarea><button class="btn primary" id="dumpX">Close</button></div></div>
  <div id="err"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function frame(now){var dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;resize();var i,a,s;
  /* camera */
  var shellK=0;
  if(mode==='move'){tr.t=Math.min(1,tr.t+dt/TRANS.duration_s);var e=smoother(tr.dir>0?tr.t:1-tr.t);camPath(e);shellK=smooth((e-TRANS.shell_fade[0])/(TRANS.shell_fade[1]-TRANS.shell_fade[0]));

  else{var c=mode==='map'?camMap():camMenu(),k=ease(dt,5);cam.T.lerp(c.T,k);cam.d=lerp(cam.d,c.d,k);cam.p=lerp(cam.p,c.p,k);cam.y=lerp(cam.y,c.y,k);shellK=mode==='map'?1:0}

    if(cat.g.position.y<0.3)AG.push({o:cat,x:cat.g.position.x,z:cat.g.position.z,r:0.2});
    updTravel(dt);
    /* the camera looking into a back room stands where the front row's back wall would block it: the front rooms go */
    roomM.forEach(function(r,i){r.visible=!(BAYS[i].row===0&&camZ<HALL.mid_wall_z-2)});
    players.concat(walkers).forEach(function(q){if(q===hero||q.mode!=='walk')return;v3.set(q.g.position.x,1,q.g.position.z);lib.localToWorld(v3);v3.project(camera);var off=Math.abs(v3.x)>JOIN.offscreen_at;
      q.speed=off?JOIN.offscreen_speed:STUDY.walk_speed;if(q.leaving&&off&&Math.hypot(q.g.position.x-camX,q.g.position.z-camZ)>JOIN.despawn_beyond_m)q.mode='gone'});
    for(i=0;i<players.length;i++)updPlayer(players[i],dt);

    players.concat(walkers,npcs).forEach(function(p){p.pose(dt,time)});
    /* chairs slide out for an arriving player, books open once seated, leaves follow their reader */

      if(on){st.open.scale.x=lerp(0.3,1,smooth((o.place-STUDY.items.swap_at)/0.15));st.pa.rotation.z=-o.theta;st.pb.rotation.z=STUDY.leaf_lag*Math.sin(o.theta);
        if(o.mugP){st.mug.position.set(o.mugP[0],o.mugP[1],o.mugP[2]);st.mug.rotation.x=o.mugTilt}else{st.mug.position.set(LIFE.mug.rest[0],LIFE.mug.rest[1],LIFE.mug.rest[2]);st.mug.rotation.x=0}
