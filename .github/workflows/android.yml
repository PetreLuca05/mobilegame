# Builds the Android APK on every push to main and publishes it as the
# "android-latest" GitHub release, so it can be downloaded straight to a phone.
#
# Online play needs two repository secrets (Settings > Secrets and variables >
# Actions): MG_SUPABASE_HOST (e.g. abcd.supabase.co) and MG_SUPABASE_ANON_KEY
# (the publishable key). Without them the APK still builds, offline only.
name: android
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: config.local.h from secrets
        env:
          HOST: ${{ secrets.MG_SUPABASE_HOST }}
          KEY: ${{ secrets.MG_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then
            printf '#ifndef MG_CONFIG_LOCAL_H\n#define MG_CONFIG_LOCAL_H\n#define MG_SUPABASE_HOST "%s"\n#define MG_SUPABASE_ANON_KEY "%s"\n#endif\n' "$HOST" "$KEY" > config.local.h
          else
            echo "::warning::Supabase secrets not set - building an offline-only APK"
            cp config.local.h.example config.local.h
          fi

      - name: Build APK
        working-directory: platform/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk mobilegame.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest mobilegame.apk \
            --title "Android build (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone, download mobilegame.apk and install it." \
            --prerelease --target "$GITHUB_SHA"
